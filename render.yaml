services:
  - type: web
    name: plas-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SHEETS_WEBHOOK_URL
        sync: false
      - key: ROBOFLOW_ENABLED
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_MODEL
        sync: false
      - key: ROBOFLOW_VERSION
        sync: false
